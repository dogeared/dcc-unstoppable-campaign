# Extends keycloak.v2 so all templates and PatternFly classes stay upstream.
# This theme only layers the Unstoppable look on top via CSS.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is the parent theme's stylesheet; our CSS is additive.
styles=css/styles.css css/unstoppable.css

# The app is dark-only; keep the login page dark regardless of OS preference.
darkMode=false
