name: unstoppable

# Production stack for Synology Container Manager.
#
# Copy .env.production.example to .env (same folder as this file) and adjust.
# The app joins the shared Docker network so the existing cloudflared tunnel
# can route https://dcc-unstoppable-campaign.dogeared.dev to http://unstoppable-app:8080.
services:
  db:
    image: postgres:17-alpine
    container_name: unstoppable-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-unstoppable}
      POSTGRES_USER: ${DB_USER:-unstoppable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - unstoppable-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-unstoppable} -d ${DB_NAME:-unstoppable}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default

  app:
    build: .
    image: unstoppable:latest
    container_name: unstoppable-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-unstoppable}
      DB_USER: ${DB_USER:-unstoppable}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://auth.dogeared.dev}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-https://auth.dogeared.dev}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-unstoppable}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-unstoppable-app}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - default
      - shared

networks:
  default:
  shared:
    external: true
    name: ${SHARED_NETWORK:-nas-shared}

volumes:
  unstoppable-pg:
