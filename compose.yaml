name: unstoppable

services:
  db:
    image: postgres:17-alpine
    container_name: unstoppable-db
    environment:
      POSTGRES_DB: unstoppable
      POSTGRES_USER: unstoppable
      POSTGRES_PASSWORD: unstoppable
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - unstoppable-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unstoppable -d unstoppable"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: unstoppable-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8084}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/unstoppable
      DB_USER: unstoppable
      DB_PASSWORD: unstoppable
      # Browser-facing dev URL: the shared local Keycloak through the mkcert
      # reverse proxy in ~/Projects/local-keycloak.
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://auth.dev.dogeared.dev}
      # Back-channel URL. The app joins local-infra, where the shared dev
      # Keycloak answers to `keycloak`. The realm pins frontendUrl, so the
      # issuer still matches the browser-facing host.
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-unstoppable}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-unstoppable-app}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - local-infra
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      start_period: 40s
      retries: 5

networks:
  local-infra:
    external: true

volumes:
  unstoppable-pg:
