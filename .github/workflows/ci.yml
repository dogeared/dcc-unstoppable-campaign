name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.results.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # Frontend tests run first, before Vaadin's prepare-frontend rewrites package.json.
      # `npm install` (not `npm ci`) keeps the lock file tolerant of platform-specific
      # optional dependencies such as the rolldown native bindings.
      - name: Install frontend test dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests with coverage
        id: frontend
        continue-on-error: true
        run: npm run test:coverage

      # Test failures don't stop the build, so the JaCoCo report and badges are still produced;
      # the job is failed at the end instead
      - name: Run backend tests with coverage
        id: build
        continue-on-error: true
        run: mvn -B test -Dmaven.test.failure.ignore=true

      - name: Summarize results and build badges
        id: results
        run: python3 .github/scripts/badges.py badges

      - name: Upload badges
        uses: actions/upload-artifact@v7
        with:
          name: badges
          path: badges/

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/frontend-coverage/
          if-no-files-found: ignore

      - name: Fail if the build or tests failed
        if: steps.build.outcome == 'failure' || steps.frontend.outcome == 'failure' || steps.results.outputs.tests_failed == 'true'
        run: |
          echo "::error::Build or tests failed"
          exit 1

  # Badge JSON lives on the `badges` branch so badge updates never add commits to main.
  # Runs after failures too, so the tests badge shows them.
  publish-badges:
    name: Publish badges
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-badges
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: badges
          path: new-badges

      - name: Push to the badges branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" badges >/dev/null; then
            git clone --quiet --depth 1 --branch badges "$REPO_URL" badges
          else
            git init --quiet -b badges badges
            git -C badges remote add origin "$REPO_URL"
          fi
          cp new-badges/*.json badges/
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged"
          else
            git commit --quiet -m "Update badges for ${GITHUB_SHA::7}"
            git push --quiet origin badges
          fi

  # Keeps git tags in step with the pom: the first green build of a new version tags it
  tag-version:
    name: Tag version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create tag for the pom version if missing
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists"
          else
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
            echo "Created tag $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: "ghcr.io/dogeared/dcc-unstoppable-campaign"
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: "."
          file: "Dockerfile"
          platforms: "linux/amd64"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: nas-deploy-dcc-unstoppable-campaign
      cancel-in-progress: false
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Ask the NAS to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          PROJECT: dcc-unstoppable-campaign
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "DEPLOY_WEBHOOK_URL or DEPLOY_WEBHOOK_SECRET is not set; skipping deploy"
            exit 0
          fi
          BODY=$(printf '{"project":"%s","sha":"%s"}' "$PROJECT" "$GITHUB_SHA")
          TS=$(date +%s)
          SIG=$(python3 -c 'import hashlib,hmac,sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode()+b"."+sys.argv[3].encode(), hashlib.sha256).hexdigest())' "$DEPLOY_WEBHOOK_SECRET" "$TS" "$BODY")
          attempt=1
          while true; do
            code=$(curl -sS -o /tmp/nas-deploy.out -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "X-Deploy-Timestamp: $TS" \
              -H "X-Deploy-Signature: sha256=$SIG" \
              --data "$BODY") || code=000
            if [ "$code" != "409" ] || [ "$attempt" -ge 3 ]; then
              break
            fi
            echo "another deploy is running; retrying in 10s ($attempt/3)"
            sleep 10
            attempt=$((attempt + 1))
          done
          cat /tmp/nas-deploy.out 2>/dev/null || true
          case "$code" in
            2??) ;;
            *) echo "deploy failed with HTTP $code"; exit 1 ;;
          esac
